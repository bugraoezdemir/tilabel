[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tilewise-ccl"
version = "0.0.2"
description = "Fast tile-wise connected-components labeling of large N-D arrays, returning a lazy dask array"
readme = "README.md"
# 3.11+ to match dyna-zarr, which the `backend="dyna"` path depends on.
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Bugra Oezdemir", email = "bugraa.ozdemir@gmail.com"},
]
# Kept in sync with the GitHub repository topics.
keywords = [
    "connected-components", "labeling", "segmentation", "ndimage", "out-of-core",
    "memory-bounded", "chunked-array", "image-processing", "bioimage", "microscopy",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]

dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.6.0",
    "dask",
]

# Features that need more than the core three. Each is imported lazily, at the point of
# use, and raises a message naming the extra - so a plain `pip install tilewise-ccl` stays
# light and only fails when you actually reach for one of these.
[project.optional-dependencies]
# `backend="dyna"`: memory-bounded pull-model tile reads + a dask-free Phase B.
dyna = ["dyna-zarr>=0.0.5"]
# `labeler="cc3d"`: a ~2x faster per-tile CCL kernel (3-D only, holds the GIL, so it only
# pays off with executor="process").
cc3d = ["connected-components-3d"]
all = ["dyna-zarr>=0.0.5", "connected-components-3d"]
dev = [
    "pytest>=7.0",
    # the legacy tests write into a zarr output buffer
    "zarr>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/bugraoezdemir/tilewise-ccl"

[tool.setuptools.packages.find]
where = ["src"]
